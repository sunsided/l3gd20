---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    permissions:
      contents: read
      id-token: write # OIDC token exchange for crates.io trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check tag matches crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "l3gd20-ng") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crate version ${version}"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section between "## [<version>]" and the next "## [" heading, minus its link line.
          awk -v v="${version}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f && index($0, "[" v "]:") != 1 { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::No CHANGELOG.md section for ${version}"
            exit 1
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat "${RUNNER_TEMP}/release-notes.md"
            echo "RELEASE_NOTES_EOF"
          } >> "${GITHUB_OUTPUT}"
      # rust.yml does not run on tags; crates.io versions are immutable.
      - name: Run tests
        run: cargo test --all-features
      # crates.io rejects a version twice, so a full re-run fails here. After a failed
      # github-release job, use "Re-run failed jobs": it keeps this job's notes output.
      # If this step fails after the upload went through, create the release by hand:
      # gh release create vX.Y.Z --verify-tag --notes-file <the CHANGELOG section>
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; no third-party actions run in this job
    steps:
      - name: Create GitHub Release
        run: |
          # Idempotent, so a re-run after a failed release step does not need a new publish.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" --verify-tag "${prerelease[@]}" \
            --title "${GITHUB_REF_NAME#v}" --notes-file "${RUNNER_TEMP}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.publish.outputs.notes }}
