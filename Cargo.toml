[package]
name = "l3gd20-ng"
version = "0.2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "A platform agnostic SPI driver to interface with the L3GD20 gyroscope"
keywords = ["embedded-hal-driver", "gyroscope", "MEMS", "IMU", "l3gd20"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
homepage = "https://github.com/sunsided/l3gd20"
repository = "https://github.com/sunsided/l3gd20"
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[features]
default = []
defmt = ["dep:defmt", "l3gd20-registers/defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
embedded-hal = "1.0.0"
l3gd20-registers = "0.3.0"

[dev-dependencies]
fake-bus = "0.1.0"
test-format = "0.1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
