# cargo-release configuration: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
allow-branch = ["main"]
pre-release-commit-message = "Release {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/l3gd20/releases/tag/v{{version}}", exactly = 1 },
]
# Publishing happens in .github/workflows/release.yml (crates.io trusted publishing) when the tag is pushed.
publish = false
